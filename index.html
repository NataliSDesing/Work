<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1611">
<title>Хронографы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Ruslan+Display&display=swap">
<style>
/* Тёмное дерево, пергамент и золото. Игра-симулятор: карта открывается туманом, порт строится за монеты. */
:root {
  --wood: #1d1611; --wood2: #2b2017; --parch: #f0e1bd; --parch2: #e5d1a1; --edge: #a88347;
  --gold: #e3b04b; --gold2: #f4d37a; --golddk: #8a5d14; --navy: #262b66; --navy2: #171a45;
  --red: #b4452f; --red2: #8e3220; --teal: #2f7f86; --green: #4f8a3e;
  --ink: #2b1d12; --ink2: #5b4630; --cream: #fff4d6; --ok: #3f8a4f; --bad: #b4452f;
  --fh: "Ruslan Display", "Georgia", serif; --fb: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; font-family: var(--fb); font-size: 16px; font-weight: 600; color: var(--cream); min-height: 100vh;
  background: var(--wood);
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 78px),
    radial-gradient(120% 50% at 50% 0%, #3b2a1b 0%, transparent 70%);
}
button { font: inherit; cursor: pointer; border: 0; color: inherit; }
button:focus-visible, .node:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px; }
.wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px 96px; }
h2, h3, .fh { font-family: var(--fh); font-weight: 400; letter-spacing: .02em; }
.ico { display: inline-block; vertical-align: middle; flex: none; }

/* Шапка */
.hud { position: sticky; top: 0; z-index: 3; background: linear-gradient(#2e2218, #231a12); border-bottom: 3px solid var(--gold); box-shadow: 0 4px 12px rgba(0,0,0,.5); }
.hud .row { max-width: 520px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.medal { width: 50px; height: 50px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--gold); box-shadow: 0 0 0 2px var(--wood), 0 0 12px rgba(227,176,75,.45); background: radial-gradient(circle at 35% 30%, #4a3a28, #1b130c); }
.medal b { font-family: var(--fh); font-weight: 400; font-size: 24px; color: var(--gold2); }
.who { flex: 1; min-width: 0; }
.who b { display: block; font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: #d8c8a2; }
.xp { height: 12px; margin-top: 5px; border: 2px solid var(--gold); border-radius: 7px; background: #120c07; overflow: hidden; }
.xp i { display: block; height: 100%; width: 0; background: linear-gradient(#f4d37a, #d79a2c); transition: width .5s; }
.chip { display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 5px; border-radius: 16px; background: #120c07; border: 2px solid var(--edge); font-weight: 800; font-size: 14px; color: var(--gold2); }
.chips { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }

/* Лента-заголовок */
.banner { filter: drop-shadow(0 3px 0 rgba(0,0,0,.45)); margin: 6px 0 12px; }
.banner > div { background: var(--gold); padding: 3px 0; clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); }
.banner span { display: block; padding: 10px 30px; text-align: center; font-family: var(--fh); font-size: 20px; line-height: 1.2; color: var(--gold2); background: linear-gradient(var(--navy), var(--navy2)); clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); text-wrap: balance; }

/* Пергаментная панель */
.panel { position: relative; color: var(--ink); background: linear-gradient(160deg, #f6e9c8, var(--parch) 45%, var(--parch2)); border: 2px solid var(--edge); border-radius: 6px; padding: 18px; box-shadow: 0 6px 0 rgba(0,0,0,.4), inset 0 0 40px rgba(168,131,71,.28); margin-top: 14px; }
.panel::after { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(168,131,71,.65); border-radius: 3px; pointer-events: none; }
.panel p { margin: 0 0 10px; line-height: 1.45; }
.story { font-style: italic; color: var(--ink2); }
.muted { color: var(--ink2); }
.cap { font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--red2); margin-bottom: 6px; }

/* Кнопки */
.btn { display: block; width: 100%; padding: 13px 16px; margin-top: 12px; border-radius: 8px; font-weight: 800; font-size: 16px; text-align: center; color: var(--ink); background: linear-gradient(#f4d37a, #d79a2c); border: 2px solid var(--golddk); box-shadow: 0 4px 0 var(--golddk); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--golddk); }
.btn.red { color: var(--cream); background: linear-gradient(#cc5a42, var(--red2)); border-color: #5e2113; box-shadow: 0 4px 0 #5e2113; }
.btn.ghost { color: var(--ink); background: linear-gradient(#f3e5c1, #e2cc9a); border-color: var(--edge); box-shadow: 0 4px 0 #7d6234; }
.btn:disabled { opacity: .45; }
.btn.sm { display: inline-flex; align-items: center; gap: 6px; width: auto; padding: 8px 12px; margin: 0; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Вкладки глав */
.chtabs { display: flex; gap: 8px; margin-bottom: 10px; }
.chtabs button { flex: 1; padding: 9px 4px; border-radius: 8px 8px 0 0; font-family: var(--fh); font-size: 17px; background: #2a2016; color: #bba983; border: 2px solid #4a3a28; border-bottom: 0; }
.chtabs button.on { background: var(--parch); color: var(--ink); border-color: var(--edge); }
.chtabs button:disabled { opacity: .55; }

/* Карта */
.mapbox { border: 3px solid var(--edge); outline: 2px solid var(--wood); border-radius: 6px; background: #c9cfc0; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,.45); }
.mapbox > svg { display: block; width: 100%; height: auto; }
.node { cursor: pointer; }
.node.locked { cursor: default; }
.node .hexp { stroke: #2b1d12; stroke-width: 4; }
.node.done .hexp { fill: url(#gold); }
.node.open .hexp { fill: var(--red); }
.node.locked .hexp { fill: #3b3228; stroke: #7a6a50; }
.node .par { font-family: var(--fh); font-size: 32px; text-anchor: middle; }
.node.done .par { fill: var(--ink); }
.node.open .par { fill: var(--cream); }
.node.locked .par { fill: #8a7a60; }
.nlabel { font-family: var(--fb); font-weight: 800; font-size: 30px; text-anchor: middle; fill: var(--cream); paint-order: stroke; stroke: #1d1611; stroke-width: 7px; stroke-linejoin: round; }
.nstars { font-size: 30px; text-anchor: middle; fill: var(--gold2); paint-order: stroke; stroke: #1d1611; stroke-width: 6px; }
.pulse { fill: none; stroke: var(--gold2); stroke-width: 4; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.8); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
.route { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 4 16; animation: march 1.4s linear infinite; filter: drop-shadow(0 0 4px rgba(0,0,0,.6)); }
.rlabel { font-family: var(--fb); font-weight: 800; font-size: 26px; fill: var(--cream); paint-order: stroke; stroke: #1d1611; stroke-width: 6px; }
.trail { fill: none; stroke: var(--gold2); stroke-width: 5; stroke-dasharray: 10 14; stroke-linecap: round; opacity: .9; }
@keyframes march { to { stroke-dashoffset: -40; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 14px; color: #d8c8a2; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); }

/* Изучение материала */
.lesson { text-align: center; }
.lico { width: 96px; height: 96px; margin: 0 auto 10px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fbf1d6, #e2cc9a); border: 3px solid var(--edge); box-shadow: 0 3px 0 #7d6234; }
.lh { font-size: 26px; line-height: 1.15; margin: 4px 0 10px; color: var(--ink); text-wrap: balance; }
.lt { font-size: 17px; line-height: 1.5; text-align: left; color: var(--ink); }
.dots { display: flex; justify-content: center; gap: 7px; margin: 12px 0 2px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #cdb98a; border: 1.5px solid var(--edge); }
.dots i.on { background: var(--red); border-color: var(--red2); }
.dots i.past { background: var(--gold); }

/* Вопросы */
.qhead { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.qhead .x { width: 36px; height: 36px; flex: none; border-radius: 50%; background: #3a2c1f; border: 2px solid var(--edge); font-size: 16px; }
.qbar { flex: 1; height: 12px; border: 2px solid var(--gold); border-radius: 7px; background: #120c07; overflow: hidden; }
.qbar i { display: block; height: 100%; background: linear-gradient(#7cc47a, var(--green)); transition: width .4s; }
.seal { flex: none; min-width: 48px; height: 48px; padding: 0 4px; display: grid; place-items: center; border-radius: 50%; font-family: var(--fh); font-size: 16px; color: #ffd9cf; background: radial-gradient(circle at 35% 30%, #d4604a, var(--red2)); box-shadow: 0 0 0 3px #6e2415, 0 3px 0 3px rgba(0,0,0,.4); }
.q { font-weight: 800; font-size: 19px; line-height: 1.3; margin: 0 0 14px; color: var(--ink); }
.opt { display: block; width: 100%; text-align: left; margin-bottom: 10px; padding: 13px 14px; font-size: 16px; line-height: 1.3; color: var(--ink); background: linear-gradient(#fbf1d6, #ecdcb2); border: 2px solid var(--edge); border-radius: 6px; box-shadow: 0 3px 0 #7d6234; }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 #7d6234; }
.opt.right { background: #cfe8cf; border-color: var(--ok); box-shadow: 0 3px 0 #2d6a3a; }
.opt.wrong { background: #f0c8bd; border-color: var(--bad); box-shadow: 0 3px 0 #7d2a1a; }
.opt.sel { border-color: var(--navy); background: #dfe3f6; }
.opt.used { opacity: .35; }
.opt.dim { opacity: .55; }
.opt.cut { opacity: .25; text-decoration: line-through; }
.seq { min-height: 54px; background: rgba(168,131,71,.22); border: 2px dashed var(--edge); border-radius: 6px; padding: 8px; margin-bottom: 14px; }
.seq .opt { margin: 0 0 6px; padding: 10px 12px; border-color: var(--navy); box-shadow: none; }
.seq .ph { color: var(--ink2); padding: 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cols .opt { padding: 10px; font-size: 14px; margin: 0 0 10px; }
.fb { border-radius: 6px; padding: 14px; margin-top: 12px; color: var(--ink); border: 2px solid; background: #fbf1d6; line-height: 1.4; }
.fb.ok { border-color: var(--ok); background: #dcefd9; }
.fb.no { border-color: var(--bad); background: #f6d9d0; }
.fb b { display: block; margin-bottom: 4px; font-family: var(--fh); font-weight: 400; font-size: 20px; }
.hintrow { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.center { text-align: center; }
.stars-big { font-size: 56px; line-height: 1.1; text-align: center; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.45); margin: 6px 0; letter-spacing: 4px; }
.emblem { width: 96px; height: 96px; margin: 8px auto; display: grid; place-items: center; border-radius: 50%; border: 4px solid var(--gold); background: radial-gradient(circle at 35% 30%, #4a3a28, #1b130c); box-shadow: 0 0 20px rgba(227,176,75,.4); }
.reward { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 6px 0 10px; font-weight: 800; }
.reward span { display: inline-flex; align-items: center; gap: 5px; }

/* Вымпелы-карточки */
.pennants { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; margin-top: 12px; }
.pennant { position: relative; padding: 14px 10px 36px; text-align: center; color: var(--cream); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 90%, 0 100%); background: var(--pc, #5b3f8f); box-shadow: inset 0 0 0 3px rgba(255,255,255,.12); }
.pennant::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: rgba(0,0,0,.28); }
.pennant .ci { margin-top: 4px; }
.pennant b { display: block; font-weight: 800; font-size: 15px; line-height: 1.2; margin: 4px 0; }
.pennant small { display: block; text-align: left; font-size: 12.5px; line-height: 1.35; color: #f2e8cc; font-weight: 600; }
.pennant.off { --pc: #3a3430; filter: grayscale(1); opacity: .65; }
.pennant.pop { animation: pop .4s; }
@keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* Порт */
.portbox { border: 3px solid var(--edge); outline: 2px solid var(--wood); border-radius: 6px; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,.45); }
.portbox > svg { display: block; width: 100%; height: auto; }
.build { display: flex; gap: 12px; align-items: center; }
.build + .build { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--edge); }
.build .bi { width: 56px; height: 56px; flex: none; display: grid; place-items: center; border-radius: 10px; background: radial-gradient(circle at 35% 30%, #fbf1d6, #e2cc9a); border: 2px solid var(--edge); }
.build .bt { flex: 1; min-width: 0; }
.build .bt b { font-weight: 800; font-size: 17px; }
.build .bt small { display: block; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
.pips { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: 2px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; background: #cdb98a; border: 1.5px solid var(--edge); }
.pips i.on { background: var(--gold); border-color: var(--golddk); }

/* Архив */
.arch { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-bottom: 10px; padding: 12px; color: var(--ink); background: linear-gradient(#fbf1d6, #ecdcb2); border: 2px solid var(--edge); border-radius: 6px; box-shadow: 0 3px 0 #7d6234; }
.arch:disabled { opacity: .5; }
.arch b { display: block; font-weight: 800; }
.arch small { color: var(--ink2); }

/* Подтверждение, факт */
.modal { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 20px; background: rgba(8,5,2,.72); }
.modal > .panel { margin: 0; width: 100%; max-width: 420px; }
.factico { width: 84px; height: 84px; margin: 0 auto 8px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fbf1d6, #e2cc9a); border: 3px solid var(--edge); }
.fact { font-size: 18px; line-height: 1.45; text-align: center; margin: 4px 0 4px !important; }
input[type=text], textarea { width: 100%; font: inherit; padding: 12px; color: var(--ink); background: #fffaf0; border: 2px solid var(--edge); border-radius: 6px; }
textarea { min-height: 90px; font-family: ui-monospace, monospace; font-size: 12px; }

/* Нижнее меню */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; background: linear-gradient(#2e2218, #1b130c); border-top: 3px solid var(--gold); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { flex: 1; padding: 8px 2px; background: none; font-size: 13px; font-weight: 800; color: #bba983; }
nav.tabs button.on { color: var(--gold2); }
nav.tabs .ico { display: block; margin: 0 auto 2px; opacity: .7; }
nav.tabs button.on .ico { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .route, .pulse, .pennant.pop, .shake { animation: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="map.js"></script>
<script src="icons.js"></script>
<script src="lessons.js"></script>
<script>
// ---------- Состояние ----------
const KEY = "chronographs.v1";
const $app = document.getElementById("app");
const defaults = () => ({ v: 1, name: "", xp: 0, coins: 0, b: { yard: 0, lib: 0, mkt: 0, light: 0 }, read: {}, m: {}, w: {}, cards: [], day: "", streak: 0, reviewDay: "" });
let S = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1) { const d = Object.assign(defaults(), s); d.b = Object.assign(defaults().b, s.b || {}); return d; }
  } catch (e) {}
  return defaults();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
function today() { return new Date().toISOString().slice(0, 10); }
function touchStreak() {
  const t = today();
  if (S.day === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.streak = S.day === y ? S.streak + 1 : 1;
  S.day = t;
}
function levelInfo() {
  let i = 0;
  while (i + 1 < LEVELS.length && S.xp >= LEVELS[i + 1].xp) i++;
  const cur = LEVELS[i], next = LEVELS[i + 1];
  const pct = next ? Math.round((S.xp - cur.xp) / (next.xp - cur.xp) * 100) : 100;
  return { n: i + 1, title: cur.title, pct, left: next ? next.xp - S.xp : 0 };
}
const allQuestions = () => MISSIONS.flatMap(m => m.questions);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const banner = t => `<div class="banner"><div><span>${esc(t)}</span></div></div>`;
const missionState = i => S.m[MISSIONS[i].id] ? "done" : (i === 0 || S.m[MISSIONS[i - 1].id]) ? "open" : "locked";
const nextIndex = () => MISSIONS.findIndex(m => !S.m[m.id]);

// ---------- Симулятор порта ----------
const BUILD = {
  lib:   { name: "Библиотека", ico: "book",       effect: "+8 монет за каждый новый изученный материал за уровень." },
  yard:  { name: "Верфь",      ico: "hammer",     effect: "+10 монет за каждую впервые пройденную миссию за уровень. Корабль в порту растёт." },
  mkt:   { name: "Рынок",      ico: "stall",      effect: "+20 % монет за верные ответы за уровень." },
  light: { name: "Маяк",       ico: "lighthouse", effect: "Подсказки в испытании: по одной за уровень в каждой миссии." }
};
const COST = [60, 140, 260];
const SHIPS = ["Лодка", "Каравелла", "Галеон", "Флагман"];
function buy(k) {
  const l = S.b[k];
  if (l >= 3 || S.coins < COST[l]) return;
  S.coins -= COST[l]; S.b[k] = l + 1; save(); viewPort();
}

// ---------- Подтверждение и факты ----------
function ask(text, yes, onYes) {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="panel"><p>${esc(text)}</p><div class="grid2"><button class="btn ghost" id="no">Отмена</button><button class="btn" id="yes">${esc(yes)}</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#no").onclick = () => m.remove();
  m.querySelector("#yes").onclick = () => { m.remove(); onYes(); };
}
let lastFact = -1;
function showFact() {
  let k; do { k = Math.floor(Math.random() * FACTS.length); } while (k === lastFact && FACTS.length > 1);
  lastFact = k;
  const f = FACTS[k];
  document.querySelectorAll(".modal").forEach(x => x.remove());
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="panel center"><div class="cap">Судовой журнал · факт дня</div><div class="factico">${ico(f.i, 54)}</div>
    <p class="fact">${esc(f.t)}</p>
    <div class="grid2"><button class="btn ghost" id="more">Ещё факт</button><button class="btn red" id="ok">В путь</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#more").onclick = showFact;
  m.querySelector("#ok").onclick = () => m.remove();
}

// ---------- Каркас ----------
let tab = "map";
let chap = null;
function shell(inner) {
  const L = levelInfo();
  $app.innerHTML = `
  <header class="hud"><div class="row">
    <button class="medal" id="prof" aria-label="Профиль"><b>${L.n}</b></button>
    <div class="who"><b>${esc(S.name)}</b><small>${L.title} · ${S.xp} оч.</small>
      <div class="xp"><i style="width:${L.pct}%"></i></div></div>
    <div class="chips"><div class="chip">${ico("coin", 22)}${S.coins}</div><div class="chip">${ico("flame", 22)}${S.streak}</div></div>
  </div></header>
  <div class="wrap">${inner}</div>
  <nav class="tabs">
    ${[["map", "map", "Карта"], ["port", "ship", "Порт"], ["arch", "book", "Архив"], ["cards", "flag", "Вымпелы"]].map(t => `<button data-t="${t[0]}" class="${tab === t[0] ? "on" : ""}">${ico(t[1], 26)}${t[2]}</button>`).join("")}
  </nav>`;
  $app.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });

// ---------- Карта ----------
function hexPts(R) {
  return [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 3 * i; return (R * Math.cos(a)).toFixed(1) + "," + (R * Math.sin(a)).toFixed(1); }).join(" ");
}
function smooth(pts) {
  const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const f = p => p[0].toFixed(1) + " " + p[1].toFixed(1);
  let d = "M" + f(mid(pts[n - 1], pts[0]));
  for (let i = 0; i < n; i++) d += "Q" + f(pts[i]) + " " + f(mid(pts[i], pts[(i + 1) % n]));
  return d + "Z";
}
function curve(pts) {
  let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (let i = 1; i < pts.length - 1; i++) {
    const m = [(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2];
    d += "Q" + pts[i][0].toFixed(1) + " " + pts[i][1].toFixed(1) + " " + m[0].toFixed(1) + " " + m[1].toFixed(1);
  }
  const l = pts[pts.length - 1];
  return d + "L" + l[0].toFixed(1) + " " + l[1].toFixed(1);
}

function mapSvg(ch) {
  const cfg = MAPS[ch];
  const P = ll => cfg.proj(ll[0], ll[1]);
  const idxs = MISSIONS.map((m, i) => i).filter(i => MISSIONS[i].chapter === ch);
  const allDone = idxs.every(i => S.m[MISSIONS[i].id]);
  const land = LAND.map(p => `<path d="${smooth(p.map(P))}" fill="#ecdcb0" stroke="#a98650" stroke-width="3" stroke-linejoin="round"/>`).join("");
  const water = WATER.map(p => `<path d="${smooth(p.map(P))}" fill="#c9cfc0" stroke="#a98650" stroke-width="3"/>`).join("");
  let fogHoles = "";
  idxs.forEach(i => {
    const st = missionState(i), m = MISSIONS[i];
    if (st === "locked" || allDone) return;
    const [x, y] = P(PLACES[m.id].ll);
    fogHoles += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${st === "done" ? cfg.reveal.done : cfg.reveal.open}" fill="url(#hole)"/>`;
  });
  let routes = "";
  ROUTES.filter(r => S.m[r.mission] && MISSIONS.find(m => m.id === r.mission).chapter === ch).forEach(r => {
    const pts = r.pts.map(P), e = pts[pts.length - 1];
    const right = e[0] > 760;
    routes += `<path class="route" d="${curve(pts)}" stroke="${r.color}"/>${r.name ? `<text class="rlabel" x="${(e[0] + (right ? 30 : 0)).toFixed(0)}" y="${(e[1] + 56).toFixed(0)}" text-anchor="${right ? "end" : "middle"}">${esc(r.name)}</text>` : ""}`;
  });
  const reached = idxs.filter(i => missionState(i) !== "locked").map(i => P(PLACES[MISSIONS[i].id].ll));
  const trail = reached.length > 1 ? `<path class="trail" d="${reached.map((p, k) => (k ? "L" : "M") + p[0].toFixed(0) + " " + p[1].toFixed(0)).join("")}"/>` : "";
  const R = 46;
  let nodes = "";
  const rank = { locked: 0, done: 1, open: 2 };
  idxs.slice().sort((a, b) => rank[missionState(a)] - rank[missionState(b)]).forEach(i => {
    const m = MISSIONS[i], st = missionState(i), [x, y] = P(PLACES[m.id].ll);
    const stars = S.m[m.id] ? "★".repeat(S.m[m.id]) : "";
    nodes += `<g class="node ${st}" data-id="${m.id}" transform="translate(${x.toFixed(0)},${y.toFixed(0)})" ${st === "locked" ? 'aria-disabled="true"' : 'tabindex="0" role="button"'} aria-label="${esc(m.par + ". " + m.title)}">
      ${st === "open" ? `<circle class="pulse" r="${R + 6}"/>` : ""}
      <polygon class="hexp" points="${hexPts(R)}"/>
      <text class="par" y="11">${st === "locked" ? "?" : esc(m.par.replace("§ ", "§"))}</text>
      ${st === "done" ? `<text class="nstars" y="${-R - 12}">${stars}</text>${icoAt(MISSION_ICON[m.id], R - 8, -R - 24, 60)}` : ""}
      ${st !== "locked" ? `<text class="nlabel" y="${R + 40}">${esc(PLACES[m.id].name)}</text>` : ""}
    </g>`;
  });
  return `<svg viewBox="0 0 ${cfg.w} ${cfg.h}" role="img" aria-label="Карта главы ${ch}">
    <defs>
      <radialGradient id="hole"><stop offset="0" stop-color="#000"/><stop offset=".6" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d37a"/><stop offset="1" stop-color="#d79a2c"/></linearGradient>
      <mask id="fogmask"><rect width="${cfg.w}" height="${cfg.h}" fill="${allDone ? "#000" : "#fff"}"/>${fogHoles}</mask>
    </defs>
    <rect width="${cfg.w}" height="${cfg.h}" fill="#c9cfc0"/>${land}${water}
    <rect width="${cfg.w}" height="${cfg.h}" fill="#1c150f" fill-opacity=".94" mask="url(#fogmask)"/>
    ${trail}${routes}${nodes}
    <g transform="translate(${cfg.w - 70},62)" opacity=".85"><polygon points="0,-44 8,-8 44,0 8,8 0,44 -8,8 -44,0 -8,-8" fill="#e3b04b" stroke="#2b1d12" stroke-width="3"/><text y="-52" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="26" fill="#fff4d6" stroke="#1d1611" stroke-width="5" paint-order="stroke">С</text></g>
  </svg>`;
}

function viewLesson(id, mode, k) {
  const m = MISSIONS.find(x => x.id === id), cards = LESSONS[id], c = cards[k];
  const last = k === cards.length - 1;
  shell(`${banner(m.par + " · " + (mode === "prep" ? "Подготовка" : "Архив"))}

// ---------- Игровая сессия ----------
let run = null;
function startMission(m) {
  run = {
    kind: "mission", mission: m, queue: shuffle(m.questions), total: m.questions.length,
    firstTry: 0, xp: 0, coins: 0, hints: S.b.light, seen: {}, replay: !!S.m[m.id], answered: 0
  };
  nextQ();
}
function startReview() {
  const pool = allQuestions().filter(q => S.m[q.id.split("q")[0]]);
  const weighted = shuffle(pool).sort((a, b) => (S.w[b.id] || 0) - (S.w[a.id] || 0) + (Math.random() - .5));
  run = { kind: "review", queue: weighted.slice(0, 5), total: Math.min(5, pool.length), firstTry: 0, xp: 0, coins: 0, hints: 0, seen: {}, answered: 0 };
  nextQ();
}
function nextQ() {
  if (!run.queue.length) return finish();
  const q = run.queue[0];
  const retry = !!run.seen[q.id];
  shell(`<div class="qhead"><button class="x" id="quit" aria-label="Выйти">✕</button>
    <div class="qbar"><i style="width:${Math.min(100, run.answered / run.total * 100)}%"></i></div>
    <div class="seal">${Math.min(run.answered + 1, run.total)}/${run.total}</div></div>
    <div class="panel"><div class="cap">${run.kind === "review" ? "Повторение" : "Событие в пути"}${retry ? " · ещё раз" : ""}</div>
    <div class="q">${esc(q.q)}</div><div id="body"></div><div id="fb"></div></div>`);
  document.getElementById("quit").onclick = () => ask("Выйти? Прогресс этой миссии не сохранится.", "Выйти", () => { run = null; render(); });
  const body = document.getElementById("body");
  ({ choice: qChoice, tf: qTf, order: qOrder, match: qMatch })[q.t](q, body, ok => answer(q, ok));
}
function answer(q, ok) {
  const retry = !!run.seen[q.id];
  run.seen[q.id] = true;
  if (!ok) S.w[q.id] = (S.w[q.id] || 0) + 1;
  let gain = 0, coins = 0;
  if (ok) {
    if (!retry) run.firstTry++;
    gain = run.kind === "review" ? 5 : retry ? 3 : run.replay ? 3 : 10;
    coins = Math.round(gain * (1 + 0.2 * S.b.mkt));
    run.xp += gain; S.xp += gain; run.coins += coins; S.coins += coins;
  }
  if (ok || retry) { run.queue.shift(); run.answered++; }
  else { run.queue.push(run.queue.shift()); }
  save();
  const fb = document.getElementById("fb");
  fb.innerHTML = `<div class="fb ${ok ? "ok" : "no"} pop"><b>${ok ? `Верно! +${coins} монет` : "Не совсем"}</b>${esc(q.e)}</div>
    <button class="btn red" id="next">Дальше</button>`;
  document.getElementById("next").onclick = nextQ;
  fb.scrollIntoView({ behavior: "smooth", block: "end" });
}

function lock(root) { root.querySelectorAll("button").forEach(b => b.disabled = true); }

function qChoice(q, root, done, noHint) {
  const canHint = !noHint && run.hints > 0 && q.o.length > 2;
  root.innerHTML = (canHint ? `<div class="hintrow"><button class="btn sm ghost" id="hint">${ico("lighthouse", 20)}Подсказка (${run.hints})</button></div>` : "") +
    q.o.map((t, i) => `<button class="opt" data-i="${i}">${esc(t)}</button>`).join("");
  const hb = root.querySelector("#hint");
  if (hb) hb.onclick = () => {
    const wrong = [...root.querySelectorAll(".opt")].filter((b, j) => j !== q.a && !b.classList.contains("cut"));
    if (wrong.length <= 1) return;
    const b = wrong[Math.floor(Math.random() * wrong.length)];
    b.classList.add("cut"); b.disabled = true; run.hints--;
    hb.innerHTML = `${ico("lighthouse", 20)}Подсказка (${run.hints})`;
    if (!run.hints) hb.disabled = true;
  };
  root.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = i === q.a;
    root.querySelectorAll(".opt").forEach((x, j) => { if (j === q.a) x.classList.add("right"); else if (j === i) x.classList.add("wrong"); else if (!x.classList.contains("cut")) x.classList.add("dim"); });
    lock(root); done(ok);
  });
}
function qTf(q, root, done) {
  qChoice({ ...q, o: ["Верно", "Неверно"], a: q.a ? 0 : 1 }, root, done, true);
}
function qOrder(q, root, done) {
  const order = shuffle(q.items.map((t, i) => ({ t, i })));
  const picked = [];
  const draw = () => {
    root.innerHTML = `<div class="seq">${picked.length ? picked.map((p, n) => `<div class="opt">${n + 1}. ${esc(p.t)}</div>`).join("") : `<div class="ph">Нажимай на события по порядку…</div>`}</div>
      ${order.map((o, k) => `<button class="opt ${picked.includes(o) ? "used" : ""}" data-k="${k}" ${picked.includes(o) ? "disabled" : ""}>${esc(o.t)}</button>`).join("")}
      <div class="grid2"><button class="btn ghost" id="rs">Сбросить</button><button class="btn" id="ck" ${picked.length === order.length ? "" : "disabled"}>Проверить</button></div>`;
    root.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { picked.push(order[+b.dataset.k]); draw(); });
    root.querySelector("#rs").onclick = () => { picked.length = 0; draw(); };
    root.querySelector("#ck").onclick = () => {
      const ok = picked.every((p, n) => p.i === n);
      root.innerHTML = `<div class="seq">${q.items.map((t, n) => `<div class="opt right">${n + 1}. ${esc(t)}</div>`).join("")}</div>`;
      done(ok);
    };
  };
  draw();
}
function qMatch(q, root, done) {
  const L = shuffle(q.pairs.map((p, i) => ({ t: p[0], i })));
  const R = shuffle(q.pairs.map((p, i) => ({ t: p[1], i })));
  const solved = new Set(); let selL = null, mistakes = 0;
  const draw = () => {
    root.innerHTML = `<div class="cols"><div>${L.map((o, k) => `<button class="opt ${solved.has(o.i) ? "right" : selL === o ? "sel" : ""}" data-l="${k}" ${solved.has(o.i) ? "disabled" : ""}>${esc(o.t)}</button>`).join("")}</div>
      <div>${R.map((o, k) => `<button class="opt ${solved.has(o.i) ? "right" : ""}" data-r="${k}" ${solved.has(o.i) ? "disabled" : ""}>${esc(o.t)}</button>`).join("")}</div></div>`;
    root.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { selL = L[+b.dataset.l]; draw(); });
    root.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
      if (!selL) return;
      if (R[+b.dataset.r].i === selL.i) {
        solved.add(selL.i); selL = null; draw();
        if (solved.size === q.pairs.length) { lock(root); done(mistakes === 0); }
      } else {
        mistakes++; selL = null; draw();
        root.querySelectorAll("[data-r]")[+b.dataset.r]?.classList.add("shake");
      }
    });
  };
  draw();
}

const PENNANT = ["#5b3f8f", "#2f7f86", "#b4452f", "#b8841a", "#4f8a3e"];
function finish() {
  touchStreak();
  const r = run; run = null;
  let extra = "";
  if (r.kind === "mission") {
    const acc = r.firstTry / r.total;
    const stars = acc >= .9 ? 3 : acc >= .6 ? 2 : 1;
    const prevStars = S.m[r.mission.id] || 0;
    S.m[r.mission.id] = Math.max(prevStars, stars);
    const gained = r.mission.cards.filter(c => !S.cards.includes(c));
    S.cards.push(...gained);
    if (!prevStars) { S.xp += 20; r.xp += 20; const bonus = 10 + 10 * S.b.yard; S.coins += bonus; r.coins += bonus; }
    chap = r.mission.chapter;
    extra = `<div class="stars-big">${"★".repeat(stars)}<span style="opacity:.3">${"★".repeat(3 - stars)}</span></div>
      <p class="center">С первой попытки: <b>${r.firstTry} из ${r.total}</b></p>
      ${prevStars ? "" : `<p class="center">На карте открылся участок: <b>${esc(PLACES[r.mission.id].name)}</b></p>`}
      ${gained.length ? `<b class="fh" style="font-size:20px">Новые вымпелы</b><div class="pennants">${gained.map((c, k) => `<div class="pennant pop" style="--pc:${PENNANT[k % 5]}"><div class="ci">${ico(CARD_ICON[c], 44)}</div><b>${esc(CARDS[c].name)}</b></div>`).join("")}</div>` : ""}`;
  } else {
    S.reviewDay = today();
    extra = `<div class="emblem">${ico("book", 56)}</div><p class="center">Повторение — лучший способ ничего не забыть. Правильно с первой попытки: <b>${r.firstTry} из ${r.total}</b></p>`;
  }
  save();
  const L = levelInfo();
  shell(`${banner(r.kind === "mission" ? "Экспедиция вернулась в порт" : "Повторение завершено")}
    <div class="panel">${extra}
    <div class="reward"><span>${ico("coin", 28)}+${r.coins} монет</span><span>${ico("star", 26)}+${r.xp} оч.</span></div>
    <p class="center">Уровень ${L.n}: ${L.title}${L.left ? ` (до следующего ${L.left})` : ""}</p>
    <button class="btn red" id="home">К карте</button>
    <button class="btn ghost" id="port">В порт: потратить монеты</button></div>`);
  document.getElementById("home").onclick = () => { tab = "map"; render(); };
  document.getElementById("port").onclick = () => { tab = "port"; render(); };
}

// ---------- Вымпелы ----------
function viewCards() {
  const ids = Object.keys(CARDS);
  shell(`${banner("Вымпелы героев: " + S.cards.length + " из " + ids.length)}<div class="pennants">${ids.map((id, k) => {
    const has = S.cards.includes(id), c = CARDS[id];
    return `<div class="pennant ${has ? "" : "off"}" style="--pc:${PENNANT[k % 5]}"><div class="ci">${has ? ico(CARD_ICON[id], 44) : ico("help", 44)}</div><b>${has ? esc(c.name) : "???"}</b>
      <small>${has ? esc(c.text) : "Пройди миссию, чтобы открыть"}</small></div>`;
  }).join("")}</div>`);
}

// ---------- Профиль и код для учителя ----------
function makeCode() {
  const o = { v: 1, n: S.name, x: S.xp, m: S.m, w: S.w, d: S.day, s: S.streak, c: S.cards.length };
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function viewMe() {
  const code = makeCode();
  shell(`${banner("Профиль капитана")}<div class="panel"><p>Покажи этот код учителю, и класс увидит общий прогресс.</p>
    <textarea readonly id="code">${code}</textarea>
    <button class="btn" id="copy">Скопировать код</button></div>
    <div class="panel"><button class="btn ghost" id="fact" style="margin-top:0">Показать факт</button>
    <button class="btn ghost" id="reset">Начать заново на этом телефоне</button></div>`);
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(code); document.getElementById("copy").textContent = "Скопировано ✓"; }
    catch (e) { document.getElementById("code").select(); try { document.execCommand("copy"); } catch (e2) {} }
  };
  document.getElementById("fact").onclick = showFact;
  document.getElementById("reset").onclick = () => {
    ask("Всё удалить: очки, монеты, порт, вымпелы, имя?", "Удалить", () => { try { localStorage.removeItem(KEY); } catch (e) {} S = load(); tab = "map"; chap = null; render(); });
  };
}

render();
if (S.name) showFact();
</script>
